name: openwrt-build
on:
  workflow_dispatch:
    # --- source patches (explicit only; a source-check flag never starts trial) ---
    # Cron/schedule has no inputs, so SOURCE_PATCH_MODE stays at the Makefile
    # default (apply): all patches, cheap advisory check at most, no extra build.
    inputs:
      source_patch_mode:
        description: 'SOURCE_PATCH_MODE: apply (default, all patches), check (source check only), trial (without-patch build; set skip_source_patches or leave empty to skip flagged ones)'
        required: false
        default: apply
        type: choice
        options:
          - apply
          - check
          - trial
      skip_source_patches:
        description: 'SKIP_SOURCE_PATCHES for trial (e.g. 001,002). Ignored unless source_patch_mode=trial.'
        required: false
        default: ''
        # --- end source patches ---
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: '15 3 * * 0'
jobs:
  build:
    name: Building openwrt img
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: ["ath79", "mt798x"]
    container:
      # Ubuntu 24.04
      image: sarcasticadmin/openwrt-build@sha256:25ac9d0dd4eeaad1aaaa7c82c09e9ecc103c69224fc55eb9717c4cfb018a5281
      # Since user is openwrt and gets 1001 from inside container
      options: --user 1001
    steps:
      - uses: actions/checkout@v1
        with:
          ref: ${{ env.BRANCH }}
      - name: 'Build openwrt'
        shell: bash
        run: |
          # Make tee pipeline raises in case of fail
          set -o pipefail
          cd openwrt
          # --- source patches (explicit only) ---
          # workflow_dispatch inputs; empty on cron → apply. Never auto-trial.
          MODE="${{ github.event.inputs.source_patch_mode }}"
          MODE="${MODE:-apply}"
          SKIP="${{ github.event.inputs.skip_source_patches }}"
          export SOURCE_PATCH_MODE="$MODE"
          export SKIP_SOURCE_PATCHES="$SKIP"
          if [ "$MODE" = check ]; then
            TARGET=${{ matrix.target }} make check-source-patches 2>&1 | tee ${{ matrix.target }}-build.log
          else
            TARGET=${{ matrix.target }} make templates build-img package 2>&1 | tee ${{ matrix.target }}-build.log
          fi
          # --- end source patches ---
      - name: 'Upload openwrt build artifact tarball'
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.target }}-openwrt-build-artifacts
          # Cant use relative pathing .. or . for artifacts action
          # Also dont bother with '${{ github.workspace }}'
          path: |
            openwrt/build/artifacts/*.tar.gz
          retention-days: 30
          # Since we cant turn off compression set to lowest level
          compression-level: 0
          # rerunning jobs overwrites artifacts from previous runs
          # this was the default behavior in v3.x
          # ref: https://github.com/actions/upload-artifact/blob/v3.1.1/README.md?plain=1#L152
          overwrite: true
          # if we dont have images, scream loudly
          if-no-files-found: "error"
      - name: 'Upload openwrt build log'
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.target }}-openwrt-buildlog
          path: |
            openwrt/*build.log
          retention-days: 30
          overwrite: true
          if-no-files-found: "error"
